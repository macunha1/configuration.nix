---
name: Nix Flake Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * Sat"

jobs:
  flake-update:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nrdxp.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nrdxp.cachix.org-1:Fc5PSqY2Jm1TrWfm88l6cvGWwz3s93c6IOifQWnhNW4= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Nix | Flake Update (latest versions to flake.lock)
        run: make update

      - name: Nix | Validate updated lock before committing
        run: make ci

      - name: SSH | Load deploy key to SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.GIT_REPO_SSH_KEY }}

      - name: Git | Import GPG key to sign commits
        id: git_import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GH_ACTIONS_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GH_ACTIONS_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Git | Commit & Push Flake updates
        run: |
          # Check for changes or exit soon
          [[ -n $(git status -s) ]] || exit 0

          git config --local user.email "${{ steps.git_import_gpg.outputs.email }}"
          git config --local user.name "${{ steps.git_import_gpg.outputs.name }}"
          git config --local user.signingkey "${{ steps.git_import_gpg.outputs.keyid }}"
          GIT_BRANCH_NAME="autoupdate-${GITHUB_RUN_ID}"
          git checkout -b "${GIT_BRANCH_NAME}"

          git add -A
          git commit -S -m "chore(flake): [auto] Updating Flake Lock"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" "${GIT_BRANCH_NAME}"
