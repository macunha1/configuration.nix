---
name: Nix Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub cron cannot express a rolling 10-day interval, so use a stable
    # calendar approximation without running twice across month boundaries.
    - cron: "0 0 1,11,21 * *"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nrdxp.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nrdxp.cachix.org-1:Fc5PSqY2Jm1TrWfm88l6cvGWwz3s93c6IOifQWnhNW4= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Nix | Check and build Nixbox
        run: make ci
